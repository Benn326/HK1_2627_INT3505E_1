openapi: 3.0.3

info:
  title: Pet Store API
  version: 1.0.0
  description: API quản lý thú cưng trong Pet Store

servers:
  - url: http://localhost:5000/api

tags:
  - name: pets
    description: Quản lý thú cưng

paths:

  /pets:
    get:
      tags:
        - pets
      operationId: listPets
      summary: Lấy danh sách thú cưng
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags:
        - pets
      operationId: createPet
      summary: Tạo thú cưng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'


  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'

    get:
      tags:
        - pets
      operationId: getPetById
      summary: Lấy thông tin một thú cưng
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    patch:
      tags:
        - pets
      operationId: updatePet
      summary: Cập nhật thông tin thú cưng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - pets
      operationId: deletePet
      summary: Xóa thú cưng
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'


components:

  parameters:

    PetId:
      name: petId
      in: path
      required: true
      description: ID của thú cưng
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Số lượng thú cưng tối đa được trả về
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10


  schemas:

    Pet:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 1

        name:
          type: string
          minLength: 1
          example: Buddy

        category:
          type: string
          example: Dog

        status:
          type: string
          enum:
            - available
            - pending
            - sold
          example: available

      example:
        id: 1
        name: Buddy
        category: Dog
        status: available


    PetInput:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
          example: Buddy

        category:
          type: string
          example: Dog

        status:
          type: string
          enum:
            - available
            - pending
            - sold
          example: available


    PetList:
      type: array
      items:
        $ref: '#/components/schemas/Pet'


    ApiResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:

        success:
          type: boolean
          example: true

        message:
          type: string
          example: Request completed successfully

        data:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/Pet'
            - $ref: '#/components/schemas/PetList'
            - type: object
              additionalProperties: true
            - type: 'null'


    ErrorResponse:
      type: object
      required:
        - success
        - message
        - error
      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Request failed

        error:
          type: object
          required:
            - code
            - detail
          properties:
            code:
              type: string
              example: PET_NOT_FOUND

            detail:
              type: string
              example: Pet with id 999 was not found


  responses:

    Success:
      description: Thao tác thành công
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: true
            message: Request completed successfully
            data:
              id: 1
              name: Buddy
              category: Dog
              status: available


    Created:
      description: Tạo thú cưng thành công
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: true
            message: Pet created successfully
            data:
              id: 2
              name: Milo
              category: Cat
              status: available


    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Invalid request
            error:
              code: BAD_REQUEST
              detail: The request parameters are invalid


    NotFound:
      description: Không tìm thấy thú cưng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Pet not found
            error:
              code: PET_NOT_FOUND
              detail: Pet with id 999 was not found


    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Validation failed
            error:
              code: VALIDATION_ERROR
              detail: Pet name is required


    ServerError:
      description: Lỗi máy chủ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Internal server error
            error:
              code: INTERNAL_SERVER_ERROR
              detail: An unexpected error occurred