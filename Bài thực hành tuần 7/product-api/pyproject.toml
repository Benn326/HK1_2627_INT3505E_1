[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-api"
version = "0.1.0"
description = "Product API CRUD with Flask, SQLAlchemy 2.x, and Marshmallow"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0",
    "marshmallow>=3.20",
    "Flask-Migrate>=4.0",
    "gunicorn>=22.0",
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
