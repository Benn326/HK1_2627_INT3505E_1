
extends:
  - spectral:oas

rules:
  info-contact: off
  operation-description: off
  operation-tags: off

  response-200-must-have-properties:
    description: Response 200 must define a non-empty object or array schema
    message: Response 200 schema must define properties or array items
    severity: error
    given: "$.paths[*][*].responses['200'].content[*].schema"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - type: object
              required:
                - properties
              properties:
                properties:
                  type: object
                  minProperties: 1
            - type: object
              required:
                - type
                - items
              properties:
                type:
                  const: array
